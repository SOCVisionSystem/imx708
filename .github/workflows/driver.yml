name: driver-ci

on:
  push:
    paths: ['imx708-driver/**']
  pull_request:
    paths: ['imx708-driver/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Build library
        run: make -C imx708-driver lib
      - name: Build test apps
        run: make -C imx708-driver test
